name: Playtest build
on:
  push:
    branches: [main, "playtest/**"]
  workflow_dispatch:
jobs:
  windows-playtest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCS2CLONE_BUILD_PLAYTEST=ON
      - name: Build
        run: cmake --build build --config Release --target feel_lab --parallel 4
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path playtest | Out-Null
          Copy-Item build/Release/feel_lab.exe playtest/
          Compress-Archive -Path playtest/* -DestinationPath CS2Clone-Feel-Lab-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CS2Clone-Feel-Lab-Windows
          path: CS2Clone-Feel-Lab-Windows.zip
